aid: caddi
name: CADDi
description: >-
  CADDi is a Tokyo-headquartered manufacturing-technology company that builds an
  AI Data Platform for industrial manufacturers. Its two products, CADDi Drawer
  and CADDi Quote, aggregate scattered 2D engineering drawings and supply-chain
  data into a single searchable asset, offering keyword and drawing-similarity
  search, automatic extraction of dimensions, text and shapes, and AI-assisted
  quotation and sourcing. The platform serves procurement, engineering, sales,
  production, quality, and leadership teams across automotive, robotics, and
  precision-machinery sectors, and connects to ERP, CAM, CAD, and quality
  systems via batch and CSV imports. CADDi was surfaced as a portfolio company
  of Atomico and DCM Ventures and added to the API Evangelist network. It does
  not currently publish a public developer API or SDK.
